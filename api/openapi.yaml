openapi: 3.1.0
info:
  title: Companies Service
  version: 1.0.0
  description: |
    CRUD for companies. Mutations require a JWT bearer token and publish an event to Kafka.
    Writes use optimistic locking: send the `ETag` from the last read in `If-Match`.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/companies:
    post:
      summary: Create a company
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompanyCreate'}
      responses:
        '201':
          description: Created
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
  /api/v1/companies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get a company
      responses:
        '200':
          description: OK
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      summary: Partially update a company (JSON Merge Patch, RFC 7396)
      description: Absent fields stay unchanged. `description` set to null removes it. Other fields cannot be null.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/CompanyPatch'}
      responses:
        '200':
          description: Updated
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Delete a company
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    ETag:
      description: Current company version, for example "3".
      schema: {type: string}
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last read. Missing gives 428, stale gives 412.
      schema: {type: string, example: '"1"'}
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CompanyType:
      type: string
      enum: [Corporations, NonProfit, Cooperative, Sole Proprietorship]
    CompanyCreate:
      type: object
      additionalProperties: false
      required: [name, amount_of_employees, registered, type]
      properties:
        name: {type: string, minLength: 1, maxLength: 15, description: 'Unique, case-insensitive. No control characters.'}
        description: {type: [string, 'null'], maxLength: 3000, description: Control characters other than tab and line breaks are rejected.}
        amount_of_employees: {type: integer, minimum: 0, maximum: 2147483647}
        registered: {type: boolean}
        type: {$ref: '#/components/schemas/CompanyType'}
    CompanyPatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 15}
        description: {type: [string, 'null'], maxLength: 3000}
        amount_of_employees: {type: integer, minimum: 0, maximum: 2147483647}
        registered: {type: boolean}
        type: {$ref: '#/components/schemas/CompanyType'}
    Company:
      type: object
      required: [id, name, description, amount_of_employees, registered, type, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, 'null']}
        amount_of_employees: {type: integer}
        registered: {type: boolean}
        type: {$ref: '#/components/schemas/CompanyType'}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
    CompanyEvent:
      description: |
        Value of a record in the `companies.events` topic. Key is the company id.
        `company.version` grows strictly per company, including on `company.deleted`.
      type: object
      properties:
        event_id: {type: string, format: uuid}
        event_type: {type: string, enum: [company.created, company.updated, company.deleted]}
        occurred_at: {type: string, format: date-time}
        company: {$ref: '#/components/schemas/Company'}
